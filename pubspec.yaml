name: resilient_mqtt
description: >-
  A resilience layer for mqtt_client: exponential backoff with jitter,
  connection state as a Stream, automatic re-subscribe and typed decoders.
  Pure Dart.
version: 0.0.1
repository: https://github.com/GabrielRobinsonAzevedo/resilient_mqtt
issue_tracker: https://github.com/GabrielRobinsonAzevedo/resilient_mqtt/issues
topics:
  - mqtt
  - iot
  - reconnect
  - networking

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  mqtt_client: ^10.12.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
