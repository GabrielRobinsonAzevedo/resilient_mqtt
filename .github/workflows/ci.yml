name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    name: analyze + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test -x integration

  integration:
    name: integration (Mosquitto)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    env:
      MQTT_HOST: localhost
      MQTT_PORT: '1883'
      MQTT_BROKER_STOP_CMD: docker stop mosquitto
      MQTT_BROKER_START_CMD: docker start mosquitto && sleep 2
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # `docker run` instead of `services:` so the repo config can be mounted
      # and tests can stop/start the broker to simulate outages.
      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            -v "${{ github.workspace }}/tool/mosquitto:/mosquitto/config:ro" \
            eclipse-mosquitto:2
          for i in $(seq 1 20); do
            nc -z localhost 1883 && break
            sleep 0.5
          done
      - run: dart pub get
      - run: dart test -t integration --concurrency=1
      - name: Mosquitto logs
        if: failure()
        run: docker logs mosquitto
